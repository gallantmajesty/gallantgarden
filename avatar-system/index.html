<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Focus Lily — Companion Studio</title>
  <link rel="stylesheet" href="./styles/avatar.css" />
  <link rel="stylesheet" href="./styles/studio.css" />
</head>
<body>
  <main id="app"></main>
  <script type="module">
    import { CompanionStudio } from './studio/CompanionStudio.js'
    import { loadCatalog } from './data/catalog.js'
    import { LocalCatalogProvider } from './data/CatalogProvider.js'

    // Hydrate the cosmetic catalog from public/cosmetics.json BEFORE building
    // anything that reads it. Swap LocalCatalogProvider for a remote one later.
    await loadCatalog(new LocalCatalogProvider())

    // Build the whole "create your study companion" experience.
    const studio = new CompanionStudio(document.getElementById('app'))
    // expose for console tinkering: studio.avatar.equip('backItem','wings_butterfly')
    window.studio = studio
  </script>
</body>
</html>

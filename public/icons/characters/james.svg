<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDDCB5"/>
      <stop offset="100%" stop-color="#E8B88A"/>
    </radialGradient>
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#2E150D"/>
    </radialGradient>
  </defs>

  <!-- HAIR (behind) -->
  <ellipse cx="100" cy="100" rx="56" ry="52" fill="url(#hairGrad)"/>
  <ellipse cx="50" cy="115" rx="16" ry="25" fill="url(#hairGrad)"/>
  <ellipse cx="150" cy="115" rx="16" ry="25" fill="url(#hairGrad)"/>

  <!-- FACE -->
  <rect x="56" y="72" width="88" height="78" rx="22" fill="url(#skinGrad)"/>

  <!-- EARS -->
  <ellipse cx="54" cy="115" rx="8" ry="10" fill="#E8B88A"/>
  <ellipse cx="146" cy="115" rx="8" ry="10" fill="#E8B88A"/>

  <!-- EYES -->
  <ellipse cx="80" cy="112" rx="7" ry="9" fill="#1a1a1a"/>
  <ellipse cx="120" cy="112" rx="7" ry="9" fill="#1a1a1a"/>
  <ellipse cx="82" cy="109" rx="3" ry="3.5" fill="white" opacity="0.85"/>
  <ellipse cx="122" cy="109" rx="3" ry="3.5" fill="white" opacity="0.85"/>

  <!-- MOUTH -->
  <path d="M91 130 Q100 137 109 130" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- BLUE CAP - big and prominent -->
  <!-- Cap brim (sticks out front, clearly visible) -->
  <path d="M38 78 Q38 70 100 65 Q162 70 162 78 L155 85 Q100 90 45 85 Z" fill="url(#brimGrad)"/>
  <!-- Cap brim edge highlight -->
  <path d="M42 79 Q100 72 158 79" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
  <!-- Cap crown (dome) -->
  <path d="M48 80 Q48 38 100 32 Q152 38 152 80 Z" fill="url(#capGrad)"/>
  <!-- Cap front panel (darker) -->
  <path d="M55 78 Q55 45 100 40 Q145 45 145 78 Z" fill="#2563EB"/>
  <!-- Cap button on top -->
  <circle cx="100" cy="33" r="5" fill="#1D4ED8"/>
  <circle cx="100" cy="33" r="2.5" fill="#3B82F6"/>
  <!-- Cap highlight -->
  <path d="M65 72 Q65 48 100 44" stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cap stitching -->
  <path d="M100 33 L100 75" stroke="rgba(0,0,0,0.12)" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M78 38 L75 75" stroke="rgba(0,0,0,0.08)" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M122 38 L125 75" stroke="rgba(0,0,0,0.08)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- HAIR (in front of face, below cap) -->
  <path d="M56 85 Q56 78 70 78 L56 100 Z" fill="url(#hairGrad)"/>
  <path d="M144 85 Q144 78 130 78 L144 100 Z" fill="url(#hairGrad)"/>

  <!-- NECK -->
  <rect x="88" y="148" width="24" height="14" rx="4" fill="url(#skinGrad)"/>

  <!-- BODY - black jacket -->
  <rect x="52" y="158" width="96" height="68" rx="12" fill="#111118"/>
  <!-- Jacket collar V -->
  <path d="M78 158 L100 172 L122 158" stroke="#333" stroke-width="2.5" fill="none"/>
  <!-- Shoulders -->
  <ellipse cx="60" cy="165" rx="14" ry="8" fill="#1a1a25"/>
  <ellipse cx="140" cy="165" rx="14" ry="8" fill="#1a1a25"/>

  <!-- ARMS -->
  <rect x="26" y="160" width="26" height="56" rx="13" fill="#111118"/>
  <rect x="148" y="160" width="26" height="56" rx="13" fill="#111118"/>
  <!-- HANDS -->
  <circle cx="39" cy="218" r="11" fill="url(#skinGrad)"/>
  <circle cx="161" cy="218" r="11" fill="url(#skinGrad)"/>

  <!-- PANTS -->
  <rect x="56" y="222" width="36" height="36" rx="8" fill="#2a2a3a"/>
  <rect x="108" y="222" width="36" height="36" rx="8" fill="#2a2a3a"/>

  <!-- SHOES -->
  <rect x="52" y="252" width="40" height="8" rx="4" fill="white"/>
  <rect x="108" y="252" width="40" height="8" rx="4" fill="white"/>
</svg>

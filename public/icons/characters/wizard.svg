<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a87850"/>
      <stop offset="100%" stop-color="#8b6244"/>
    </radialGradient>
    <radialGradient id="orbGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#88ddff"/>
      <stop offset="100%" stop-color="#2266aa"/>
    </radialGradient>
  </defs>

  <!-- CAPE (behind body) -->
  <path d="M50 165 Q25 200 30 255 L170 255 Q175 200 150 165 Z" fill="#141420" opacity="0.95"/>
  <!-- Cape gold trim -->
  <path d="M33 252 Q100 258 167 252" stroke="#daa520" stroke-width="2.5" fill="none"/>

  <!-- HAIR (behind) - short, dark -->
  <ellipse cx="100" cy="95" rx="52" ry="45" fill="#0a0808"/>

  <!-- FACE - dark Egyptian skin -->
  <rect x="56" y="72" width="88" height="78" rx="22" fill="url(#skinGrad)"/>

  <!-- EARS -->
  <ellipse cx="54" cy="115" rx="8" ry="10" fill="#8b6244"/>
  <ellipse cx="146" cy="115" rx="8" ry="10" fill="#8b6244"/>

  <!-- EYES - glowing cyan -->
  <ellipse cx="80" cy="110" rx="9" ry="8" fill="#0a0a14"/>
  <ellipse cx="120" cy="110" rx="9" ry="8" fill="#0a0a14"/>
  <ellipse cx="80" cy="110" rx="7" ry="5.5" fill="#f0f0f0"/>
  <ellipse cx="120" cy="110" rx="7" ry="5.5" fill="#f0f0f0"/>
  <ellipse cx="80" cy="110" rx="4.5" ry="4.5" fill="#44ccff"/>
  <ellipse cx="120" cy="110" rx="4.5" ry="4.5" fill="#44ccff"/>
  <ellipse cx="80" cy="110" rx="2.5" ry="2.5" fill="#0a0a14"/>
  <ellipse cx="120" cy="110" rx="2.5" ry="2.5" fill="#0a0a14"/>
  <ellipse cx="82" cy="108" rx="1.2" ry="1.2" fill="white" opacity="0.8"/>
  <ellipse cx="122" cy="108" rx="1.2" ry="1.2" fill="white" opacity="0.8"/>

  <!-- Egyptian eye markings -->
  <path d="M65 112 L55 108" stroke="#0a0a14" stroke-width="2" stroke-linecap="round"/>
  <path d="M135 112 L145 108" stroke="#0a0a14" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M70 100 L90 98" stroke="#1a0a00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M110 98 L130 100" stroke="#1a0a00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="120" rx="3" ry="3.5" fill="#6b4226"/>

  <!-- Mouth - slight smirk -->
  <path d="M91 132 Q100 137 109 131" stroke="#5a3020" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- WIZARD HAT -->
  <!-- Hat brim -->
  <ellipse cx="100" cy="75" rx="58" ry="11" fill="url(#hatGrad)"/>
  <!-- Gold band on brim -->
  <ellipse cx="100" cy="75" rx="54" ry="7" fill="none" stroke="#daa520" stroke-width="2"/>
  <!-- Hat cone -->
  <path d="M55 78 Q55 28 100 16 Q145 28 145 78 Z" fill="url(#hatGrad)"/>
  <!-- Gold band at hat base -->
  <path d="M58 76 Q100 82 142 76" stroke="#daa520" stroke-width="2.5" fill="none"/>
  <!-- Eye of Horus on hat -->
  <circle cx="100" cy="50" r="6" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <circle cx="100" cy="50" r="2.5" fill="#44ccff"/>
  <!-- Hat tip droop -->
  <path d="M130 28 Q138 22 134 16" stroke="#141420" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- HAIR (in front, below hat) - short dark -->
  <path d="M56 82 Q56 76 68 76 L56 95 Z" fill="#0a0808"/>
  <path d="M144 82 Q144 76 132 76 L144 95 Z" fill="#0a0808"/>

  <!-- NECK -->
  <rect x="88" y="148" width="24" height="14" rx="4" fill="url(#skinGrad)"/>

  <!-- BODY - dark robe -->
  <rect x="52" y="158" width="96" height="68" rx="12" fill="url(#robeGrad)"/>
  <!-- Gold trim down front -->
  <path d="M100 158 L100 226" stroke="#daa520" stroke-width="2"/>
  <!-- Egyptian hieroglyphs on chest -->
  <!-- Eye of Horus left -->
  <circle cx="78" cy="180" r="5" fill="none" stroke="#c9952a" stroke-width="1.5"/>
  <circle cx="78" cy="180" r="2" fill="#c9952a"/>
  <path d="M73 182 L70 188" stroke="#c9952a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Ankh right -->
  <circle cx="122" cy="176" r="3.5" fill="none" stroke="#c9952a" stroke-width="1.5"/>
  <path d="M122 179.5 L122 190" stroke="#c9952a" stroke-width="1.5"/>
  <path d="M118 184 L126 184" stroke="#c9952a" stroke-width="1.5"/>
  <!-- Gold collar -->
  <path d="M78 158 L100 168 L122 158" stroke="#daa520" stroke-width="2.5" fill="none"/>
  <!-- Gold belt -->
  <rect x="56" y="195" width="88" height="7" rx="3.5" fill="#daa520"/>
  <!-- Belt buckle ankh -->
  <circle cx="100" cy="198.5" r="4" fill="none" stroke="#ffd700" stroke-width="1.5"/>

  <!-- ARMS -->
  <rect x="26" y="160" width="26" height="56" rx="13" fill="url(#robeGrad)"/>
  <rect x="148" y="160" width="26" height="56" rx="13" fill="url(#robeGrad)"/>
  <!-- Gold shoulder pads -->
  <circle cx="39" cy="163" r="10" fill="#daa520"/>
  <circle cx="161" cy="163" r="10" fill="#daa520"/>
  <!-- HANDS - dark skin -->
  <circle cx="39" cy="218" r="11" fill="url(#skinGrad)"/>
  <circle cx="161" cy="218" r="11" fill="url(#skinGrad)"/>

  <!-- STAFF -->
  <rect x="172" y="130" width="4" height="110" rx="2" fill="#2a1a0a"/>
  <!-- Staff head -->
  <polygon points="174,126 168,138 180,138" fill="#daa520"/>
  <!-- Magic orb -->
  <circle cx="174" cy="122" r="7" fill="url(#orbGrad)"/>
  <circle cx="174" cy="122" r="9" fill="none" stroke="#daa520" stroke-width="1.5"/>
  <!-- Orb glow -->
  <circle cx="174" cy="122" r="11" fill="none" stroke="#44aaff" stroke-width="1" opacity="0.4"/>

  <!-- ROBE BOTTOM -->
  <path d="M56 226 Q56 248 42 255 L158 255 Q144 248 144 226 Z" fill="url(#robeGrad)"/>
  <!-- Gold trim at bottom -->
  <path d="M45 252 Q100 258 155 252" stroke="#daa520" stroke-width="2" fill="none"/>

  <!-- BOOTS -->
  <ellipse cx="72" cy="255" rx="16" ry="5" fill="#1a1008"/>
  <ellipse cx="128" cy="255" rx="16" ry="5" fill="#1a1008"/>
  <path d="M56 253 L88 253" stroke="#daa520" stroke-width="1.5"/>
  <path d="M112 253 L144 253" stroke="#daa520" stroke-width="1.5"/>
</svg>

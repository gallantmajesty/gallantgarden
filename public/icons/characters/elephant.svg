<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="elMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a5aa"/>
      <stop offset="100%" stop-color="#6e7378"/>
    </linearGradient>
    <linearGradient id="elInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a0a0"/>
      <stop offset="100%" stop-color="#b07878"/>
    </linearGradient>
  </defs>

  <!-- BIG FLOPPY EARS -->
  <ellipse cx="42" cy="80" rx="32" ry="48" fill="url(#elMain)"/>
  <ellipse cx="42" cy="80" rx="22" ry="34" fill="url(#elInner)"/>
  <ellipse cx="158" cy="80" rx="32" ry="48" fill="url(#elMain)"/>
  <ellipse cx="158" cy="80" rx="22" ry="34" fill="url(#elInner)"/>

  <!-- ROUND HEAD -->
  <ellipse cx="100" cy="82" rx="46" ry="50" fill="url(#elMain)"/>

  <!-- TRUNK — series of overlapping circles curving down -->
  <circle cx="100" cy="124" r="14" fill="url(#elMain)"/>
  <circle cx="100" cy="140" r="12" fill="url(#elMain)"/>
  <circle cx="100" cy="154" r="10" fill="url(#elMain)"/>
  <circle cx="102" cy="166" r="9" fill="#6e7378"/>
  <circle cx="104" cy="176" r="8" fill="#6e7378"/>
  <circle cx="106" cy="184" r="7" fill="#6e7378"/>
  <!-- trunk tip -->
  <ellipse cx="106" cy="190" rx="8" ry="5" fill="#5a5e62"/>

  <!-- TINY TUSKS -->
  <path d="M82 130 Q78 152 84 160" stroke="#f0ece0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M118 130 Q122 152 116 160" stroke="#f0ece0" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- FRIENDLY EYES -->
  <circle cx="82" cy="76" r="10" fill="#ffffff"/>
  <circle cx="82" cy="76" r="6" fill="#1a1a1e"/>
  <circle cx="80" cy="73" r="2.5" fill="#ffffff"/>
  <circle cx="118" cy="76" r="10" fill="#ffffff"/>
  <circle cx="118" cy="76" r="6" fill="#1a1a1e"/>
  <circle cx="116" cy="73" r="2.5" fill="#ffffff"/>

  <!-- ROSY CHEEKS -->
  <circle cx="66" cy="96" r="7" fill="#d4908a" opacity="0.5"/>
  <circle cx="134" cy="96" r="7" fill="#d4908a" opacity="0.5"/>

  <!-- BODY -->
  <rect x="56" y="194" width="88" height="40" rx="16" fill="url(#elMain)"/>

  <!-- LEGS -->
  <rect x="56" y="228" width="30" height="28" rx="10" fill="url(#elMain)"/>
  <rect x="114" y="228" width="30" height="28" rx="10" fill="url(#elMain)"/>

  <!-- FEET -->
  <ellipse cx="71" cy="254" rx="18" ry="6" fill="#6e7378"/>
  <ellipse cx="129" cy="254" rx="18" ry="6" fill="#6e7378"/>

  <!-- TOENAILS -->
  <circle cx="62" cy="254" r="3" fill="#b8bcc0"/>
  <circle cx="71" cy="255" r="3" fill="#b8bcc0"/>
  <circle cx="80" cy="254" r="3" fill="#b8bcc0"/>
  <circle cx="120" cy="254" r="3" fill="#b8bcc0"/>
  <circle cx="129" cy="255" r="3" fill="#b8bcc0"/>
  <circle cx="138" cy="254" r="3" fill="#b8bcc0"/>
</svg>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<title>Focuslily social</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }

  .banner {
    position: relative;
    width: 1080px;
    height: 1350px;
    background:
      radial-gradient(120% 90% at 12% 6%, #8fd0c4 0%, rgba(143,208,196,0) 45%),
      radial-gradient(100% 70% at 88% 100%, #6bbf4f 0%, rgba(107,191,79,0) 50%),
      linear-gradient(165deg, #f6ecd7 0%, #f0e3c6 52%, #ddeecf 100%);
    font-family: 'Baloo 2', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 90px 70px 0;
    overflow: hidden;
    text-align: center;
  }

  .hills {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 240px;
    background:
      radial-gradient(520px 320px at 8% 100%, rgba(107,191,79,0.5) 60%, transparent 62%),
      radial-gradient(640px 360px at 45% 100%, rgba(79,158,60,0.42) 55%, transparent 62%),
      radial-gradient(540px 320px at 88% 100%, rgba(107,191,79,0.48) 58%, transparent 63%);
  }

  .logo {
    width: 250px; height: 250px;
    margin-top: 24px;
    object-fit: contain;
    filter: drop-shadow(0 14px 30px rgba(79, 98, 60, 0.28));
  }

  .eyebrow {
    margin-top: 46px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #4f9e3c;
  }
  .eyebrow::before {
    content: '';
    width: 56px; height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #ffce54, #6bbf4f);
  }

  h1 {
    margin: 34px 0 0;
    font-weight: 800;
    font-size: 190px;
    line-height: 0.98;
    letter-spacing: -0.02em;
    color: #2f4b2c;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #6bbf4f 10%, #ffce54 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin-top: 26px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 56px;
    color: #6b5740;
  }

  .pill {
    margin-top: 52px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 22px 46px;
    border-radius: 999px;
    background: linear-gradient(100deg, #4f9e3c, #6bbf4f);
    color: #fffdf6;
    font-weight: 700;
    font-size: 40px;
    box-shadow: 0 18px 44px rgba(79, 158, 60, 0.38);
  }
  .pill .dot { width: 15px; height: 15px; border-radius: 50%; background: #fff; }

  .features {
    position: relative;
    z-index: 2;
    margin-top: auto;
    margin-bottom: 110px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 600;
    font-size: 34px;
    color: #7a5a36;
  }
  .feature .tick {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(107, 191, 79, 0.18);
    color: #4f9e3c;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="hills"></div>

    <img class="logo" src="../docs/ad-shots/focuslily-logo.png" alt="Focuslily" />

    <div class="eyebrow">Study · Focus · Grow</div>
    <h1>Focus<em>lily</em></h1>
    <div class="tagline">Where your focus grows into a forest.</div>
    <div class="pill"><span class="dot"></span>Start focusing free</div>

    <div class="features">
      <div class="feature"><span class="tick">✓</span>3D study world</div>
      <div class="feature"><span class="tick">✓</span>Focus timer &amp; streaks</div>
      <div class="feature"><span class="tick">✓</span>Lofi soundtrack &amp; level up</div>
    </div>
  </div>
</body>
</html>

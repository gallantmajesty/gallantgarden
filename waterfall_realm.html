<script type="module">
import * as THREE from 'three';

// ── LIGHTS (P6) ───────────────────────────────────────────────────────────────
const sunLight = new THREE.DirectionalLight(0xfff3d6, 2.1);
sunLight.position.set(45, 85, 35);

sunLight.shadow.mapSize.set(2048, 2048);

sunLight.shadow.camera.right =  90;
sunLight.shadow.camera.top   =  90;

// ── NOISE HELPERS ─────────────────────────────────────────────────────────────
function hash2(x,y){ return Math.sin(x*127.1+y*311.7)*43758.5453%1; }
function noise2(x,y){
  const ix=Math.floor(x),iy=Math.floor(y);
  const fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=Math.abs(hash2(ix,iy)),b=Math.abs(hash2(ix+1,iy));
  const c=Math.abs(hash2(ix,iy+1)),d=Math.abs(hash2(ix+1,iy+1));
  return a+(b-a)*ux+(c-a)*uy+(d-b+a-c)*ux*uy;
}
function fbm(x,y,oct=5){
  let v=0,a=0.5,f=1;
  for(let i=0;i<oct;i++){v+=a*noise2(x*f,y*f);a*=0.5;f*=2.1;}
  return v;
}

// ── TERRAIN ───────────────────────────────────────────────────────────────────
{
  const W=220,D=220,SW=110,SD=110;
  const geo=new THREE.PlaneGeometry(W,D,SW,SD);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    let h=fbm(x*0.022+3,z*0.022+3,5)*24;
    const lakeR=Math.sqrt(x*x+(z-10)*(z-10));
    if(lakeR<30) h=Math.min(h,lakeR*0.04-1.5);
    if(Math.abs(x)<7&&z>-22&&z<8) h=Math.min(h,-0.4);
    pos.setY(i,h);
  }
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0x3d5c2a,roughness:0.93,metalness:0.01});
  const m=new THREE.Mesh(geo,mat);
  m.receiveShadow=true;
  scene.add(m);
}

// ── CLIFFS (P5 – layered, colored, moss, wet zones) ───────────────────────────
function buildCliff(cx,cy,cz,ry,w,h,d,seed){
  const geo=new THREE.BoxGeometry(w,h,d,5,10,5);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    pos.setX(i,x+(noise2(x*0.35+seed,y*0.28+seed)-0.5)*3.8);
    pos.setY(i,y+(noise2(y*0.28+seed,z*0.35+seed)-0.5)*2.2);
    pos.setZ(i,z+(noise2(z*0.35+seed+5,x*0.28+seed)-0.5)*2.8);
  }
  geo.computeVertexNormals();
  const vColors=[];
  const pa=geo.attributes.position;
  for(let i=0;i<pa.count;i++){
    const y=pa.getY(i),x=pa.getX(i),z=pa.getZ(i);
    const n=fbm(x*0.12+seed,z*0.12+seed,3);
    let r=0.36+n*0.18,g=0.32+n*0.14,b=0.28+n*0.10;
    if(y>h*0.05&&n>0.52){r=0.22;g=0.42;b=0.20;}
    if(y<-h*0.2&&Math.abs(x)<w*0.55){r*=0.55;g*=0.6;b*=0.72;}
    vColors.push(r,g,b);
  }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(vColors,3));
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.87,metalness:0.04});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(cx,cy,cz);
  m.rotation.y=ry;
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
}
buildCliff( 0,  22,-36,  0,   72,46,14, 1.0);
buildCliff(-22, 17,-28,  0.3, 32,36,11, 2.0);
buildCliff( 22, 17,-28, -0.3, 32,36,11, 3.0);
buildCliff(-56, 13,  0,  0.5, 30,28,16, 4.0);
buildCliff( 56, 13,  0, -0.5, 30,28,16, 5.0);
buildCliff(-18,  3, 10,  0.2, 15, 7, 9, 6.0);
buildCliff( 18,  3, 10, -0.2, 13, 7, 9, 7.0);
buildCliff( -8, 28,-31, -0.1, 20, 6, 9, 8.0);
buildCliff(  8, 26,-33,  0.1, 18, 6, 9, 9.0);
buildCliff(-40, 20,-15,  0.4, 18,22,10,10.0);
buildCliff( 40, 20,-15, -0.4, 18,22,10,11.0);

setProgress(50);

// ── WATERFALL SHADER (P1 – CORE FIX: realistic, NOT glowing white) ────────────
const wfVert=`
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vNorm;
void main(){
  vUv=uv;
  vec4 wp=modelMatrix*vec4(position,1.0);
  vWorld=wp.xyz;
  vNorm=normalize(normalMatrix*normal);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const wfFrag=`
uniform float time;
uniform float uOpacity;
uniform vec3 uTint;
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vNorm;

float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y);
}
float fbm2(vec2 p){float v=0.,a=0.5;for(int i=0;i<5;i++){v+=a*n2(p);p*=2.1;a*=0.5;}return v;}

void main(){
  vec2 uv=vUv;

  // Layer 1 – main downward flow
  float f1=fbm2(vec2(uv.x*3.0, uv.y*7.0-time*2.1));
  // Layer 2 – fast streaks
  float f2=fbm2(vec2(uv.x*6.0+0.4, uv.y*12.0-time*3.2));
  // Layer 3 – turbulence / breakup
  float f3=fbm2(vec2(uv.x*10.0-0.2, uv.y*4.5-time*1.4));
  // Layer 4 – slow deep flow
  float f4=fbm2(vec2(uv.x*1.8+0.7, uv.y*5.0-time*1.1));

  float water=f1*0.35+f2*0.30+f3*0.20+f4*0.15;

  // Bright streak lines (falling water sheets)
  float streak=smoothstep(0.54,0.76,f2)*0.28;
  water+=streak;

  // Edge foam (sides + top entry)
  float eFoam=smoothstep(0.10,0.0,uv.x)+smoothstep(0.90,1.0,uv.x)+smoothstep(0.06,0.0,uv.y);
  water+=eFoam*0.25;
  water=clamp(water,0.0,1.0);

  // Color palette – deep turquoise -> aerated -> soft white (NOT pure white)
  vec3 deep  =vec3(0.12,0.38,0.58);
  vec3 mid   =vec3(0.38,0.68,0.82);
  vec3 aerate=vec3(0.68,0.84,0.90);
  vec3 foam  =vec3(0.86,0.92,0.94);

  vec3 col=mix(deep,mid,smoothstep(0.2,0.5,water));
  col=mix(col,aerate,smoothstep(0.5,0.72,water));
  col=mix(col,foam,  smoothstep(0.72,0.92,water));

  // Tint
  col=mix(col,uTint,0.15);

  // Fresnel translucency (edges more transparent)
  vec3 vd=normalize(cameraPosition-vWorld);
  float fres=1.0-max(dot(vd,vNorm),0.0);
  float alpha=uOpacity*(0.50+fres*0.28+water*0.18);
  alpha=clamp(alpha,0.30,0.88);

  gl_FragColor=vec4(col,alpha);
}`;

const wfMats=[];
function makeWfMat(op,tint){
  const m=new THREE.ShaderMaterial({
    vertexShader:wfVert,fragmentShader:wfFrag,
    uniforms:{time:{value:0},uOpacity:{value:op},uTint:{value:new THREE.Color(tint)},cameraPosition:{value:camera.position}},
    transparent:true,side:THREE.DoubleSide,depthWrite:false
  });
  wfMats.push(m);return m;
}

function addWFPlane(x,y,z,w,h,ry,op,tint){
  const geo=new THREE.PlaneGeometry(w,h,8,24);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const px=pos.getX(i),py=pos.getY(i);
    pos.setX(i,px+(noise2(px*0.38,py*0.28)-0.5)*0.55);
    pos.setZ(i,pos.getZ(i)+(noise2(px*0.28+10,py*0.38)-0.5)*0.38);
  }
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,makeWfMat(op,tint));
  m.position.set(x,y,z);m.rotation.y=ry;
  scene.add(m);return m;
}

// Celestial Falls – 5 layered sheets (main centerpiece)
addWFPlane( 0,  12,-30,  20,36,  0,    0.74,0x3a80b0);
addWFPlane(-5,  10,-29,   9,32,  0.07, 0.60,0x4aa8c8);
addWFPlane( 5,  10,-29,   9,32, -0.07, 0.60,0x4aa8c8);
addWFPlane( 0,  11,-28,  14,34,  0,    0.42,0x5dc0d8);
addWFPlane(-2,   9,-27,   7,30,  0.04, 0.28,0x70d0e2);
// Left cascade

// Right cascade
addWFPlane( 25,  8,-23,   7,20, -0.48, 0.65,0x3a80b0);
addWFPlane( 25,  7,-22,   4,17, -0.48, 0.40,0x5dc0d8);

setProgress(60);

// ── LAKE SHADER (P3 – depth, Fresnel, ripples, shoreline foam) ─────────────────
const lakeVert=`
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vNorm;
varying float vDepth;
void main(){
  vUv=uv;
  vec4 wp=modelMatrix*vec4(position,1.0);
  vWorld=wp.xyz;
  vNorm=normalize(normalMatrix*normal);
  vec2 c=uv-0.5;
  vDepth=1.0-clamp(length(c)*2.1,0.0,1.0);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;
const lakeFrag=`
uniform float time;
varying vec2 vUv;
varying vec3 vWorld;
varying vec3 vNorm;
varying float vDepth;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y);
}
void main(){
  vec2 uv=vUv;
  float r1=n2(vec2(uv.x*14.+time*0.18,uv.y*14.+time*0.11));
  float r2=n2(vec2(uv.x*9.-time*0.09,uv.y*9.+time*0.14));
  float r3=n2(vec2(uv.x*22.+time*0.28,uv.y*22.-time*0.22));
  float ripple=r1*0.5+r2*0.35+r3*0.15;

  // Depth color: shallow turquoise -> deep glacial blue
  vec3 shallowC=vec3(0.30,0.74,0.74);
  vec3 midC    =vec3(0.10,0.48,0.65);
  vec3 deepC   =vec3(0.04,0.24,0.42);
  vec3 wColor=mix(shallowC,midC,vDepth*0.6);
  wColor=mix(wColor,deepC,vDepth*vDepth*0.7);
  wColor+=ripple*0.055;

  // Shoreline foam ring
  float dist=length(vUv-0.5)*2.0;
  float foam=smoothstep(0.80,0.93,dist)*(0.4+ripple*0.6);
  wColor=mix(wColor,vec3(0.88,0.94,0.94),foam*0.72);

  // Fresnel
  vec3 vd=normalize(cameraPosition-vWorld);
  float fres=pow(1.0-max(dot(vd,vNorm),0.0),2.8);
  vec3 skyR=vec3(0.52,0.76,0.94);
  wColor=mix(wColor,skyR,fres*0.52);

  float alpha=0.80+fres*0.14;
  gl_FragColor=vec4(wColor,alpha);
}`;
const lakeMat=new THREE.ShaderMaterial({
  vertexShader:lakeVert,fragmentShader:lakeFrag,
  uniforms:{time:{value:0},cameraPosition:{value:camera.position}},
  transparent:true,side:THREE.FrontSide,depthWrite:false
});

// ── SPLASH / MIST PARTICLES (P2 – soft spray, NOT white blobs) ────────────────
function makeSoftSprite(brightness,r,g,b){
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const c=cv.getContext('2d');
  const gr=c.createRadialGradient(32,32,1,32,32,30);
  const a=Math.round(brightness*255);
  gr.addColorStop(0,`rgba(${r},${g},${b},0.50)`);
  gr.addColorStop(0.45,`rgba(${r},${g},${b},0.16)`);
  gr.addColorStop(1,'rgba(200,230,255,0)');
  c.fillStyle=gr;c.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}

function buildMist(count,cx,cy,cz,spread,yH,sz,br){
  const pos=new Float32Array(count*3);
  const vel=new Float32Array(count*3);
  const life=new Float32Array(count);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,r=Math.random()*spread;
    pos[i*3]=cx+Math.cos(a)*r;pos[i*3+1]=cy+Math.random()*yH;pos[i*3+2]=cz+Math.sin(a)*r;
    vel[i*3]=(Math.random()-0.5)*0.038;vel[i*3+1]=Math.random()*0.022+0.004;vel[i*3+2]=(Math.random()-0.5)*0.038;
    life[i]=Math.random();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({map:makeSoftSprite(br,210,235,255),size:sz,transparent:true,opacity:0.32,depthWrite:false,blending:THREE.NormalBlending,sizeAttenuation:true});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  return{pts,geo,pos,vel,life,cx,cy,cz,spread,yH,count};
}

const mistSys=[
  buildMist(55, 0, 0,-18,  9,5, 3.8,0.80),  // main falls base
  buildMist(28,-24, 0,-12, 4,3, 2.6,0.75),  // left cascade
  buildMist(28, 24, 0,-12, 4,3, 2.6,0.75),  // right cascade
  buildMist(38,  0,1.2, 3,13,3, 2.9,0.72),  // lake surface
];

function updateMist(s,dt){
  for(let i=0;i<s.count;i++){
    s.life[i]+=dt*0.20;
    if(s.life[i]>1){
      s.life[i]=0;
      const a=Math.random()*Math.PI*2,r=Math.random()*s.spread;
      s.pos[i*3]=s.cx+Math.cos(a)*r;s.pos[i*3+1]=s.cy;s.pos[i*3+2]=s.cz+Math.sin(a)*r;
      s.vel[i*3]=(Math.random()-0.5)*0.038;s.vel[i*3+1]=Math.random()*0.022+0.004;s.vel[i*3+2]=(Math.random()-0.5)*0.038;
    } else {
      s.pos[i*3]+=s.vel[i*3];s.pos[i*3+1]+=s.vel[i*3+1];s.pos[i*3+2]+=s.vel[i*3+2];
    }
  }
  s.geo.attributes.position.needsUpdate=true;
}

setProgress(72);

// ── FOCUS LILY (P4 – 2x scale, petal shading, gentle float) ───────────────────
function buildLily(x,z){
  const g=new THREE.Group();
  // Pad
  const padGeo=new THREE.CircleGeometry(3.0,36);
  const padMat=new THREE.MeshStandardMaterial({color:0x2d7030,roughness:0.78,metalness:0.02,side:THREE.DoubleSide});
  const pad=new THREE.Mesh(padGeo,padMat);pad.rotation.x=-Math.PI/2;pad.position.y=0.05;g.add(pad);
  // Veins on pad
  for(let v=0;v<8;v++){
    const va=(v/8)*Math.PI*2;
    const vGeo=new THREE.CylinderGeometry(0.025,0.025,2.6,4);
    const vMat=new THREE.MeshStandardMaterial({color:0x1a5020});

  // Petals – 3 layers, pink gradient

      pm.position.set(Math.cos(pa)*dist,0.28+layer*0.16,Math.sin(pa)*dist);
      g.add(pm);
    }
  }
  // Stamen
  const stGeo=new THREE.SphereGeometry(0.30,12,8);
  const stMat=new THREE.MeshStandardMaterial({color:0xffe055,roughness:0.38,emissive:0x332200,emissiveIntensity:0.12});
  const st=new THREE.Mesh(stGeo,stMat);st.position.y=0.60;g.add(st);
  // Small stamen dots
  for(let d=0;d<8;d++){
    const da=(d/8)*Math.PI*2;
    const dGeo=new THREE.SphereGeometry(0.07,6,5);
    const dMat=new THREE.MeshStandardMaterial({color:0xffcc22,emissive:0x443300,emissiveIntensity:0.20});

    dm.position.set(Math.cos(da)*0.26,0.65,Math.sin(da)*0.26);
    g.add(dm);
  }
  g.position.set(x,0.04,z);
  g.scale.setScalar(2.3);  // 2x+ as required
  scene.add(g);
  return g;
}

// ── WOODEN BRIDGES ─────────────────────────────────────────────────────────────
function bridge(x1,z1,x2,z2,y){
  const dx=x2-x1,dz=z2-z1,len=Math.sqrt(dx*dx+dz*dz);
  const ang=Math.atan2(dx,dz);
  const mat=new THREE.MeshStandardMaterial({color:0x7a5c14,roughness:0.90,metalness:0.04});
  const deck=new THREE.Mesh(new THREE.BoxGeometry(len,0.25,2.0),mat);
  deck.position.set((x1+x2)/2,y,(z1+z2)/2);deck.rotation.y=ang;deck.castShadow=true;scene.add(deck);
  [-1,1].forEach(s=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len,0.7,0.10),mat);
    rail.position.set((x1+x2)/2,y+0.48,(z1+z2)/2+s*0.95);rail.rotation.y=ang;scene.add(rail);
  });
  const postMat=new THREE.MeshStandardMaterial({color:0x5a3c0a,roughness:0.9});
  for(let p=0;p<=Math.floor(len/2.5);p++){
    const t=p/Math.floor(len/2.5);
    const px=x1+dx*t,pz=z1+dz*t;
    [-1,1].forEach(s=>{
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.85,6),postMat);
      post.position.set(px,y+0.38,pz+s*0.95);scene.add(post);
    });
  }
}

// ── ANIMATE ───────────────────────────────────────────────────────────────────
let last=0,fCnt=0,fTime=0,fSkip=0;
const fpsEl=document.getElementById('fps');
const loader=document.getElementById('loader');
let loaderHidden=false;

function tick(t){
  requestAnimationFrame(tick);
  const dt=Math.min((t-last)/1000,0.05);last=t;
  fCnt++;fTime+=dt;
  if(fTime>0.8){fpsEl.textContent='FPS: '+Math.round(fCnt/fTime);fCnt=0;fTime=0;}
  fSkip=(fSkip+1)%2;

  if(!loaderHidden&&t>800){loader.style.opacity='0';setTimeout(()=>loader.style.display='none',1000);loaderHidden=true;setProgress(100);}

  controls.update();
  const T=t*0.001;

  // Waterfall shader time — alternate frame update
  if(fSkip===0){
    wfMats.forEach(m=>{m.uniforms.time.value=T;m.uniforms.cameraPosition.value.copy(camera.position);});
    lakeMat.uniforms.time.value=T;
    lakeMat.uniforms.cameraPosition.value.copy(camera.position);
  }

  // Lily float (P4)
  lilies.forEach((l,i)=>{
    l.position.y=0.04+Math.sin(T*0.55+i*1.3)*0.09;
    l.rotation.y=Math.sin(T*0.20+i*0.9)*0.05;
  });

  // Fire flicker
  if(fSkip===0){
    scene.children.forEach(obj=>{
      if(obj.isGroup){
        obj.traverse(ch=>{
          if(ch.isPointLight&&ch.intensity>1.0){
            ch.intensity=1.1+Math.sin(T*9+obj.position.x)*0.3+Math.random()*0.12;
          }
        });
      }
    });
  }

  // Water bounce pulse
  waterBounce.intensity=1.4+Math.sin(T*1.4)*0.22;

  // Mist update
  if(fSkip===0) mistSys.forEach(s=>updateMist(s,dt));

  // Fireflies
  if(fSkip===0){
    for(let i=0;i<FFN;i++){
      ffArr[i*3]  +=ffV[i*3]  +Math.sin(T*0.6+i)*0.004;
      ffArr[i*3+1]+=ffV[i*3+1]+Math.cos(T*0.4+i*1.4)*0.003;
      ffArr[i*3+2]+=ffV[i*3+2]+Math.sin(T*0.8+i*0.7)*0.004;
      if(ffArr[i*3]>45)ffArr[i*3]=-45;if(ffArr[i*3]<-45)ffArr[i*3]=45;
      if(ffArr[i*3+1]>20)ffArr[i*3+1]=1.5;if(ffArr[i*3+1]<0.5)ffArr[i*3+1]=12;
      if(ffArr[i*3+2]>55)ffArr[i*3+2]=-35;if(ffArr[i*3+2]<-35)ffArr[i*3+2]=55;
    }
    ffGeo.attributes.position.needsUpdate=true;
  }

  renderer.render(scene,camera);
}

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P6L9R0BXM2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-P6L9R0BXM2');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var loc = (e.filename ? ' at ' + e.filename + (e.lineno ? ':' + e.lineno : '') : '')
        showError((e.error && e.error.message ? e.error.message : (e.message || 'Unknown error')) + loc)
      })
      window.addEventListener('unhandledrejection', function (e) {
        showError(e.reason && e.reason.message ? e.reason.message : String(e.reason))
      })
      function showError(msg) {
        var div = document.getElementById('crash-error')
        if (!div) {
          div = document.createElement('div')
          div.id = 'crash-error'
          div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f1410;color:#e8efe6;z-index:999999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;overflow:auto;'
          document.body.appendChild(div)
        }
        div.innerHTML = '<div style="max-width:640px;text-align:center;"><div style="font-size:40px;margin-bottom:12px;">⚠️</div><h2 style="margin:0 0 10px;">Something went wrong</h2><pre style="white-space:pre-wrap;word-break:break-word;background:#1d241b;padding:12px;border-radius:8px;opacity:.9;font-size:13px;text-align:left;">' + String(msg).replace(/</g, '&lt;') + '</pre><button onclick="location.reload()" style="margin-top:14px;padding:10px 22px;border-radius:8px;background:#2a3a2e;color:#e8efe6;border:1px solid #4a5a4e;cursor:pointer;">Reload</button></div>'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
